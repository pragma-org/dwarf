    patched_executable_digest: sha256:b0cebe917e092c3d4e47ac4841de7a49338dca1e586616803fe17e92d0d93425
    patch_set_sha256: f0e1aebca9adf2713d4d9f6f8ba33f20b0d04c3b35de6127d4a1e027a68b50af
  cardano-node:
    version: 11.1.2
    source_repository: https://github.com/IntersectMBO/cardano-node.git
