    patched_image_reference: dwarf/cardano-measurement:11.1.2-fef83fed
    patched_image_digest: sha256:c74c3deafac54ed4d30da21952fce579c3293919993d31081e18787605757b8c
    patched_executable_digest: sha256:2777c36dbfdc4b8e57b9c839f055a65709e3049800030817a97a3943c712f738
