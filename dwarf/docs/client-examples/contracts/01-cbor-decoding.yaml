workload:
  identity: conway-plutus-data-100-plus-live-handshake-decode-cases-v1
  seed: "0xA7561CD0"
  digest: sha256:8f5b409f5c2b25b31e392365bab0e9a703a526e776a4f34dfbc3204f9b022dd9
  dataset_or_corpus:
    repository: https://github.com/r2rationality/cardano-cbor-dataset.git
    revision: a7561cd063550c2218898571520f14c3674efe91
    tree: a3b2ca9b1a009b59c2fd5f21b819a03762eac48f
    era: conway
    rule: plutus_data
    categories: [valid, zap-1, zap-2, zap-3]
    samples_per_category: 25
    live_cases: [handshake-unsupported-valid, handshake-malformed-cbor]
    attempts_per_live_case: 100
  warm_up_seconds: 30
  duration_seconds: 240
  stop_conditions:
    - Stop with failure if the exact target or workload identity differs.
    - Stop with failure on crash, panic, hang, collector error, or loss of chain progress.
    - Stop with failure if any category has fewer than 25 completed corpus inputs.
environment:
  hardware_fingerprint: cardano-box-2026-09-19
  hardware: {cpu: AMD Ryzen 7 6800U, physical_cores: 8, logical_cpus: 16, memory_bytes: 29193207808, kernel: 6.8.0-138-generic, docker: 29.6.0, storage_driver: overlayfs}
  amaru_topology: One exact Amaru target peers with one controlled Cardano-node 10.7.1 support producer; only Amaru is measured and no mixed comparison is made.
  cardano_topology: Three exact Cardano-node 11.1.2 nodes in the qualified local mesh; node1 is the measured ingress target.
functional_requirement:
  id: FR-CBOR-001
  statement: Both exact production codec adapters must return the expected terminal outcome for all 100 inputs, and every successful decode must pass decode-encode-decode-encode byte equality.
  expected_result: 100 of 100 outcomes match the frozen expectation and all successful canonical encodings are stable on the second encode.
measurements:
  - {name: production_codec_decode, boundary: Production codec entry to terminal decode result in the exact source revision, unit: us, minimum_sample_floor: 100, evidence_role: useful-distribution}
  - {name: live_protocol_receive_decode_accepted, boundary: Real node receive plus incremental protocol decode for honest accepted traffic, unit: us, minimum_sample_floor: 30, evidence_role: useful-distribution}
  - {name: live_protocol_receive_decode_rejected, boundary: Real node receive plus decode for the frozen invalid cases, unit: us, minimum_sample_floor: 30, evidence_role: useful-distribution}
evidence_quality_rules: {very_small_sample: "n < 5", small_sample: "5 <= n < 30", useful_sample: "n >= 30", authority_rule: "Per-outcome distributions need at least 30 samples; 100 corpus outcomes are functional evidence, not a complete decoder inventory."}
required_collectors:
  amaru: [amaru-patched-protocol-decode, amaru-stock-network, amaru-stock-resources, amaru-external-workload-accounting]
  cardano-node: [cardano-patched-protocol-decode, cardano-stock-network, cardano-stock-resources, cardano-external-workload-accounting]
acceptable_unavailable:
  - Metrics unrelated to decode, resources, workload accounting, target health, or chain progress can remain unavailable with a stated reason.
security_assertions:
  - {id: cbor_conformance_clean, statement: "No expected-outcome mismatch, crash, panic, timeout, or unclassified result occurs."}
  - {id: cbor_roundtrip_consistent, statement: Each successful decode has stable second-encode bytes.}
  - {id: target_progress_continues, statement: The real target stays healthy and its chain height increases after invalid traffic.}
retained_artifacts: [manifest.json, scenario.yaml, resolved-profile.json, exact target identity, dataset manifest and selected input hashes, per-input outcomes and timings, raw patched trace, measurements/report.json, measurements/report.md, assertions.json, log.ndjson, SARIF and attestation state, exportable evidence bundle and digest]
report_routes: ["/operate/runs/{run_id}", "/operate/scenarios/client-example-cbor-decoding-{implementation}-patched", "/operate/measurement-profiles/{measurement_profile}"]
legitimate_claims:
  - The exact selected implementations produced the recorded result for the frozen 100-input Plutus-data set.
  - The real nodes contained the selected live invalid decode cases and produced the recorded per-outcome timing samples.
explicit_non_claims:
  - This is not complete coverage of every Cardano CBOR type or every mini-protocol codec.
  - The production-library conformance leg and live-node ingress leg are separate boundaries.
  - The run is not automatically an Amaru-versus-Cardano performance benchmark.
verdict_policy: {security_assertions_authoritative: true, measurements_gate_by_default: false, threshold_gate: explicit-opt-in-only}
implementation_gaps:
  - {id: GAP-CBOR-PINNED-ADAPTERS, status: open, required_change: Build revision-locked production codec adapters with decode and canonical round-trip output; do not reuse the older bbce/CHaP shims as exact-release proof.}
  - {id: GAP-CBOR-LIVE-CASES, status: open, required_change: Add one bounded real-node workload that sends the exact unsupported and malformed handshake cases and correlates the hostile window.}
deferred_scope: {presentation_walkthrough: true, mixed_node_comparison: true, weekly_automation: true, stable_release_thresholds: true}
