schema_version: v1
id: client-example-01-cbor-decoding
title: CBOR decoding conformance and decode cost
status: frozen
purpose:
  technical: Verify outcome parity and self-consistent round trips at an exact production codec boundary, then measure accepted and rejected decode work at the real node ingress boundary.
  child: Give both nodes the same valid and broken messages. Check that they agree and measure how long each node takes.
scope:
  real_node_required: true
  simulation_allowed: false
  comparison_model: separate-implementation-executions-not-mixed-node
controlling_sources:
  - {name: Client conformance requirements, location: "https://gist.github.com/KtorZ/9e5fd34eb993d0bbc5158984e8be5792", sha256_or_revision: "gist-api-sha256:d38556b71b40de79b7128ed62a5282c9af4291d8eb0584a9f09f771da5f94738"}
  - {name: Risk Register v2, location: "dwarf workbench file JG-RiskRegister-V2.csv", sha256_or_revision: "sha256:11dee3e9e0cc800c7dc65fe8dde27ae55c7ad2edc8bab3c6d31402cdf56ec65a"}
  - {name: Qualified Cardano CBOR dataset, location: "https://github.com/r2rationality/cardano-cbor-dataset", sha256_or_revision: "a7561cd063550c2218898571520f14c3674efe91"}
security_mapping:
  threat_model:
    - {id: TM-015, title: Parsing / validation / implementation discrepancy, reason: The same malformed input can produce security-relevant implementation differences.}
    - {id: TM-021, title: Parsing / deserialization, reason: "Encoded input can trigger parser-bound, crash, or resource behavior."}
  risk_register:
    - {id: RR-015, title: Malformed-input handling divergence, severity: High, boundaries: [B-002, B-003, B-004, B-005], interfaces: [IF-002, IF-003, IF-004, IF-005, IF-006, IF-007], reason: The test compares terminal decode outcomes for the same bytes.}
    - {id: RR-024, title: Parser or deserialization bounds failure, severity: High, boundaries: [B-003, B-004, B-005], interfaces: [IF-003, IF-004, IF-005, IF-006], reason: The test times bounded valid and invalid inputs and rejects crashes or hangs.}
scenario_legs:
  - scenario_id: client-example-cbor-decoding-amaru-patched
    implementation: amaru
    status: additive-required
    profile: profile-q-amaru-measurement-patched
    measurement_profile: amaru-security-patched
    primitives:
      setup: [runtime_verify_exact_target]
      load: [runtime_version_pinned_cbor_conformance, runtime_protocol_decode_cases]
      probes: [runtime_target_health_and_progress]
      assertions: [cbor_conformance_clean, cbor_roundtrip_consistent, invalid_protocol_cases_contained, target_progress_continues]
      teardown: []
  - scenario_id: client-example-cbor-decoding-cardano-patched
    implementation: cardano-node
    status: additive-required
    profile: profile-t-cardano-measurement-patched
    measurement_profile: cardano-security-patched
    primitives:
      setup: [runtime_verify_exact_target]
      load: [runtime_version_pinned_cbor_conformance, runtime_protocol_decode_cases]
      probes: [runtime_target_health_and_progress]
      assertions: [cbor_conformance_clean, cbor_roundtrip_consistent, invalid_protocol_cases_contained, target_progress_continues]
      teardown: []
targets:
  amaru:
    version: 10.11.20260912
    source_repository: https://github.com/pragma-org/amaru.git
    source_revision: b159172f25a9c389f82f20bca4f15e3032791638
    supporting_cardano_version: 10.7.1
    stock_mode: stock
    stock_image_reference: ghcr.io/pragma-org/amaru:v10.11.20260912
    stock_image_digest: sha256:45d46a6ba7147bfa95d96c103820542a9e3ac3602c4c316cc0d04bbd6d71489e
    patched_mode: patched
    patched_image_reference: dwarf/amaru-measurement:10.11.20260912-b159172
