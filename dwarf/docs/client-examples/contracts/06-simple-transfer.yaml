workload:
  identity: signed-simple-payment-v1
  seed: "0x51A9E001"
  digest: "sha256:3c8caa794626594a54d6adc0b8f7c1c7fbf85e5e9054c3e17f47301108bbdaa7"
  dataset_or_corpus: {attempt_count: 35, transaction_kind: signed-simple-payment, amount_lovelace: 2000000, expected_accepted_minimum: 30, expected_rejected_minimum: 5}
  warm_up_seconds: 0
  duration_seconds: 3600
  stop_conditions:
    - Stop if the exact target identity does not match.
    - Stop if a signed transaction cannot be built or submitted through the supported lifecycle.
    - Fail if fewer than 30 attempts or accepted transfers are retained.
    - Fail on target fatal exit, unexpected restart, missing target correlation, or no chain progress.
environment:
  hardware_fingerprint: cardano-box-2026-09-19
  hardware: {cpu: AMD Ryzen 7 6800U, physical_cores: 8, logical_cpus: 16, memory_bytes: 29193207808, kernel: 6.8.0-138-generic, docker: 29.6.0, storage_driver: overlayfs}
  amaru_topology: One exact measured Amaru target receives transactions through one qualified digest-pinned Cardano producer. Only Amaru measurements support Amaru claims.
  cardano_topology: One exact measured Cardano-node target runs in the qualified three-node local mesh.
functional_requirement:
  id: FR-SIMPLE-TRANSFER-001
  statement: Each real target must process at least 30 attempted signed simple payments, and DWARF must retain every terminal outcome and duration.
  expected_result: At least 30 accepted transfers, complete per-attempt evidence, continued chain progress, and clean target health for each separate implementation run.
measurements:
  - {name: attempted_and_terminal_outcomes, boundary: "Signed transaction submission start to accepted, rejected, or timed-out terminal classification", unit: operations, minimum_sample_floor: 30, evidence_role: functional-correlation}
  - {name: offered_transaction_and_byte_rate, boundary: First to last retained workload attempt in the bounded run, unit: operations/s, minimum_sample_floor: 30, evidence_role: useful-distribution}
  - {name: duration_to_known_outcome, boundary: Monotonic submit start to terminal known outcome for every attempt, unit: us, minimum_sample_floor: 30, evidence_role: useful-distribution}
  - {name: node_resource_window, boundary: Exact measured target during the simple-transfer workload window, unit: samples, minimum_sample_floor: 30, evidence_role: useful-distribution}
evidence_quality_rules: {very_small_sample: "n < 5", small_sample: "5 <= n < 30", useful_sample: "n >= 30", authority_rule: Volume labels describe retained sample count only. They do not establish statistical authority or a cross-node benchmark.}
required_collectors:
  amaru: [amaru-external-workload-accounting, amaru-stock-mempool, amaru-stock-network, amaru-stock-resources, amaru-patched-txsubmission-residence]
  cardano-node: [cardano-external-workload-accounting, cardano-stock-txsubmission-mempool, cardano-stock-network, cardano-stock-resources, cardano-patched-protocol-decode, cardano-patched-ledger-plutus-stages]
acceptable_unavailable:
  - Amaru submit-to-protocol-response timing is unavailable because the support producer response is not an Amaru protocol-response boundary.
  - Mempool visibility or chain-adoption timing is unavailable when the node tap does not retain the transaction identifier and boundary timestamp.
  - Missing stages stay unavailable with a reason and are not converted to zero.
  - Cardano patched TxSubmission residence is Reserved and unavailable because the exact target has no such patch capability.
security_assertions:
  - {id: simple_transfers_observed, statement: At least 30 real attempts and accepted transfers have complete terminal outcome and duration evidence.}
  - {id: target_progress_continues, statement: The exact measured target continues chain progress during the workload.}
  - {id: no_target_fatal_signal, statement: "The target has no panic, fatal exit, OOM, or unexpected restart."}
retained_artifacts: [manifest.json, scenario.yaml, resolved-profile.json, exact target identity, frozen dataset, signed transaction files, per-attempt result rows, target logs, target health and tips, external accounting result, stock and patched measurement results, measurements/report.json, assertions.json, evidence bundle and digest]
report_routes: ["/operate/runs/{run_id}", "/operate/scenarios/client-example-simple-transfer-{implementation}", "/operate/measurement-profiles/{measurement_profile}", "/learn/measurement-coverage"]
legitimate_claims:
  - The exact implementation, version, workload, and environment produced the retained simple-transfer outcomes and non-vacuous measurements.
explicit_non_claims:
  - The separate runs are not an automatic Amaru-versus-Cardano benchmark.
  - The runs do not establish production capacity, universal latency, or a stable performance threshold.
  - A configured collector or zero samples do not prove that a stage was exercised.
verdict_policy: {security_assertions_authoritative: true, measurements_gate_by_default: false, threshold_gate: explicit-opt-in-only}
