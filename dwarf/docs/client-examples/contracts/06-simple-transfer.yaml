schema_version: v1
id: client-example-06-simple-transfer
title: Dedicated simple-transfer measurement
status: accepted
purpose:
  technical: Submit a frozen set of real signed payment transactions to each exact node target and retain complete external, protocol, inclusion, and resource evidence where the existing taps expose it.
  child: Send real coins between test addresses. Count every try and keep the clocks and receipts.
scope: {real_node_required: true, simulation_allowed: false, comparison_model: separate-implementation-executions-not-mixed-node}
controlling_sources:
  - {name: Simple-transfer dataset v1, location: dwarf/corpora/cardano-measurement/simple-transfer-v1.json, sha256_or_revision: "sha256:3c8caa794626594a54d6adc0b8f7c1c7fbf85e5e9054c3e17f47301108bbdaa7"}
security_mapping:
  threat_model:
    - {id: TM-012, title: Transaction submission and mempool handling, reason: The live node must accept a valid signed payment without losing or misclassifying the attempt.}
    - {id: TM-024, title: Resource exhaustion through transaction processing, reason: "The bounded run retains node CPU, memory, disk, and network observations."}
  risk_register:
    - {id: RR-012, title: Transaction admission or propagation failure, severity: High, boundaries: [B-005], interfaces: [IF-006], reason: A real signed payment must receive a terminal outcome and reach the chain when accepted.}
    - {id: RR-019, title: Resource exhaustion under submitted workload, severity: Medium, boundaries: [B-005, B-008], interfaces: [IF-006], reason: The exact target resource window is retained with the workload.}
scenario_legs:
  - scenario_id: client-example-simple-transfer-amaru
    implementation: amaru
    status: accepted
    profile: profile-x-amaru-cbor-fix-regression-nanoseconds-v2
    measurement_profile: amaru-security-patched
    primitives: {setup: [runtime_verify_exact_target], load: [runtime_controlled_simple_transfers], probes: [runtime_target_health_and_progress], assertions: [simple_transfers_observed, target_progress_continues, no_target_fatal_signal], teardown: []}
  - scenario_id: client-example-simple-transfer-cardano
    implementation: cardano-node
    status: accepted
    profile: profile-v-cardano-measurement-nanoseconds-v2
    measurement_profile: cardano-security-patched
    primitives: {setup: [runtime_verify_exact_target], load: [runtime_controlled_simple_transfers], probes: [runtime_target_health_and_progress], assertions: [simple_transfers_observed, target_progress_continues, no_target_fatal_signal], teardown: []}
