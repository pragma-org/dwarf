schema_version: v1
id: client-example-05-restart-recovery-sync
title: Restart, recovery, and synchronization
status: frozen
purpose:
  technical: Restart the exact real target, measure time until listener, live chain progress, and required peer role are all restored, then measure a controlled synchronization range.
  child: Turn the node off and on. Start the clock, wait until all important parts work again, and check that it catches up.
scope: {real_node_required: true, simulation_allowed: false, comparison_model: separate-implementation-executions-not-mixed-node}
controlling_sources:
  - {name: Client non-functional requirements, location: "https://gist.github.com/KtorZ/9e5fd34eb993d0bbc5158984e8be5792", sha256_or_revision: "gist-api-sha256:d38556b71b40de79b7128ed62a5282c9af4291d8eb0584a9f09f771da5f94738"}
  - {name: Risk Register v2, location: "dwarf workbench file JG-RiskRegister-V2.csv", sha256_or_revision: "sha256:11dee3e9e0cc800c7dc65fe8dde27ae55c7ad2edc8bab3c6d31402cdf56ec65a"}
  - {name: Known Amaru restart finding, location: dwarf/docs/finding-amaru-restart-rollback-in-future-crash.md, sha256_or_revision: classified-background-not-new}
security_mapping:
  threat_model:
    - {id: TM-014, title: Chain selection / rollback / persistence, reason: Restart recovery must reconcile ledger and chain state safely.}
    - {id: TM-018, title: Chain selection / rollback / liveness, reason: "Restart or reconnection can cause crash, stuck sync, or inconsistent state."}
    - {id: TM-032, title: Consensus persistence / rollback, reason: Recovery behavior is bounded by immutable and rollback-floor rules.}
  risk_register:
    - {id: RR-014, title: Ledger rollback failure or inconsistent rollback state, severity: High, boundaries: [B-007], interfaces: [IF-009, IF-010], reason: The target must recover without inconsistent persisted state.}
    - {id: RR-020, title: "Rollback, reconnection, or chain-switch liveness failure", severity: High, boundaries: [B-004, B-007], interfaces: [IF-004, IF-005, IF-009, IF-010], reason: "Listener, chain progress, and peer-role gates must all return after restart."}
scenario_legs:
  - scenario_id: client-example-restart-recovery-sync-amaru
    implementation: amaru
    status: additive-required
    profile: profile-u-amaru-measurement-nanoseconds-v2
    measurement_profile: amaru-security-patched
    primitives:
      setup: [runtime_verify_exact_target, runtime_wait_for_chain_progress]
      load: [runtime_real_target_restart_and_readiness, runtime_controlled_sync_range]
      probes: [runtime_target_health_and_progress, runtime_peer_session_health]
      assertions: [restart_readiness_complete, controlled_sync_range_complete, target_progress_continues, no_target_fatal_signal]
      teardown: []
  - scenario_id: client-example-restart-recovery-sync-cardano
    implementation: cardano-node
    status: additive-required
    profile: profile-v-cardano-measurement-nanoseconds-v2
    measurement_profile: cardano-security-patched
    primitives:
      setup: [runtime_verify_exact_target, runtime_wait_for_chain_progress]
      load: [runtime_real_target_restart_and_readiness, runtime_controlled_sync_range]
      probes: [runtime_target_health_and_progress, runtime_peer_session_health]
      assertions: [restart_readiness_complete, controlled_sync_range_complete, target_progress_continues, no_target_fatal_signal]
      teardown: []
targets:
  amaru: {version: 10.11.20260912, source_repository: "https://github.com/pragma-org/amaru.git", source_revision: b159172f25a9c389f82f20bca4f15e3032791638, supporting_cardano_version: 10.7.1, stock_mode: stock, stock_image_reference: "ghcr.io/pragma-org/amaru:v10.11.20260912", stock_image_digest: "sha256:45d46a6ba7147bfa95d96c103820542a9e3ac3602c4c316cc0d04bbd6d71489e", patched_mode: patched, measurement_revision: nanoseconds-v2, patch_manifest_sha256: "sha256:1012e64ad3a3f5a9abd1aea061d5036fcc8e936392f82d5829e3df7733ab6b99", build_result_sha256: "sha256:6fb4c905c299b1f4ee8066bde8bf8182d63c770edd6412568d265af873176b70", patched_image_reference: "dwarf/amaru-measurement@sha256:c3f139e87b4ada079a4dc5c656a2ca06c6dc30ea55719d54bedb772c836de862", patched_image_digest: "sha256:c3f139e87b4ada079a4dc5c656a2ca06c6dc30ea55719d54bedb772c836de862", patched_executable_digest: "sha256:05233bac96c1914a232a2d9c5a704f08401aff0b20356c015e848f295b919b78", patch_set_sha256: 4c22d7b0c29a705d1471dcfb6ee09a306c936ce83fd47f808fb2bbb8c2c75de0}
  cardano-node: {version: 11.1.2, source_repository: "https://github.com/IntersectMBO/cardano-node.git", source_revision: fef83fed01d7926f3de83b3b917be5a4a48768b5, stock_mode: stock, stock_image_reference: "ghcr.io/intersectmbo/cardano-node:11.1.2", stock_image_digest: "sha256:6365403f44713d0a046865fb0466503ef207b71beae1b1ffece7f4399356db9f", patched_mode: patched, measurement_revision: nanoseconds-v2, patch_manifest_sha256: "sha256:06405007512eb8040898fbe53984b43bb5419100e5c7c64954588ee618ad7071", build_result_sha256: "sha256:f8f94f4068483e1f3a099b25b8bb534a691fcc402711a5fedc103a0ad5b9f524", patched_image_reference: "dwarf/cardano-measurement@sha256:956ae21cf9141a7149692392453ea31ece00e33960c2cca0f79548beeacf7370", patched_image_digest: "sha256:956ae21cf9141a7149692392453ea31ece00e33960c2cca0f79548beeacf7370", patched_executable_digest: "sha256:3fb83f12ac1152e96c884c756a505484a39d9200da6c59b24678ac61218220eb", patch_set_sha256: 1c52fa42b7fd9ee3403165a5269ae851665536d2b920ed8be6fdbe490d1ed93c}
workload:
  identity: real-target-restart-and-controlled-resync-v1
  seed: "0x5E570005"
  digest: sha256:1b5e9008a96f3f231c54526719d846b0604139bdceffb42110d4f0fcc85a03f0
  dataset_or_corpus:
    restart_count: 1
    pre_restart_progress_blocks: 5
    post_restart_progress_blocks: 5
    readiness_gates: [listener, chain_progress, peer_role]
    amaru_peer_policy: single-controlled-producer
    cardano_peer_policy: three-node-controlled-local-mesh
  warm_up_seconds: 30
  duration_seconds: 420
  stop_conditions:
    - Stop with failure if the pre-restart target has not advanced by five blocks.
    - Stop with failure if the real target does not restart or any readiness gate is absent.
    - Stop with failure if the target does not advance by five more blocks or complete the controlled sync range before timeout.
    - Classify the known Amaru RollbackPointInFuture or EADDRINUSE signatures as background; do not report them as new.
environment:
  hardware_fingerprint: cardano-box-2026-09-19
  hardware: {cpu: AMD Ryzen 7 6800U, physical_cores: 8, logical_cpus: 16, memory_bytes: 29193207808, kernel: 6.8.0-138-generic, docker: 29.6.0, storage_driver: overlayfs}
  amaru_topology: One exact Amaru target retains its real state and reconnects to one controlled Cardano-node 10.7.1 support producer after a real container restart.
  cardano_topology: One measured Cardano-node restarts inside the qualified three-node 11.1.2 local mesh and reconnects to the two unchanged peers.
functional_requirement:
  id: FR-RECOVERY-001
  statement: After one real target restart, listener readiness, new chain progress, and the required peer role must all return, and the node must complete the controlled sync range without manual state repair.
  expected_result: All three readiness gates are retained with monotonic timestamps; the target advances by at least five post-restart blocks and reaches the controlled end point before 420 seconds.
measurements:
  - {name: restart_readiness, boundary: "Restart command start to the latest of listener-ready, new-chain-progress, and required-peer-role-ready", unit: s, minimum_sample_floor: 1, evidence_role: collection-proof}
  - {name: sync_speed, boundary: Controlled start and end block heights under the stated peer policy after restart, unit: blocks/s, minimum_sample_floor: 2, evidence_role: functional-correlation}
  - {name: recovery_resource_cost, boundary: Exact target process or container from restart start through controlled end height, unit: samples, minimum_sample_floor: 30, evidence_role: useful-distribution}
evidence_quality_rules: {very_small_sample: "n < 5", small_sample: "5 <= n < 30", useful_sample: "n >= 30", authority_rule: One restart proves collection and recovery for this run only; it is not a stable restart benchmark. Resource series still need at least 30 samples.}
required_collectors:
  amaru: [amaru-external-restart-readiness, amaru-external-sync-speed, amaru-stock-network, amaru-stock-resources]
  cardano-node: [cardano-external-restart-readiness, cardano-external-sync-speed, cardano-stock-network, cardano-stock-resources]
acceptable_unavailable:
  - Plutus, protocol decode, blockfetch queue, and epoch-transition metrics can remain unavailable with a stated reason.
security_assertions:
  - {id: restart_readiness_complete, statement: "Restart start plus listener, chain-progress, and peer-role gate events are present in order."}
  - {id: controlled_sync_range_complete, statement: The target reaches the exact retained end height and hash under the frozen peer policy.}
  - {id: no_target_fatal_signal, statement: "No unclassified panic, fatal termination, OOM, or crash loop occurs."}
  - {id: target_progress_continues, statement: The target advances by at least five blocks after readiness.}
retained_artifacts: [manifest.json, scenario.yaml, resolved-profile.json, target identity, pre-restart tip, restart command and container event, readiness gate events, post-restart tips, exact sync start and end points, peer-policy evidence, raw target logs and resource series, measurements/report.json, assertions.json, SARIF and attestation state, evidence bundle and digest]
report_routes: ["/operate/runs/{run_id}", "/operate/scenarios/client-example-restart-recovery-sync-{implementation}", "/operate/measurement-profiles/{measurement_profile}"]
legitimate_claims:
  - The exact target recovered from one real restart and completed the retained controlled sync range in this environment.
explicit_non_claims:
  - One restart is collection proof, not a stable mean, p95, or p99 benchmark.
  - This is not default-peer-selection mainnet synchronization and not a mixed-node comparison.
  - A known classified Amaru restart signature is not a new DWARF finding unless stock Amaru reproduces an unclassified behavior.
verdict_policy: {security_assertions_authoritative: true, measurements_gate_by_default: false, threshold_gate: explicit-opt-in-only}
implementation_gaps:
  - {id: GAP-REAL-RESTART-GATES, status: open, required_change: "Add a real profile-target restart primitive that emits restart_started, listener_ready, chain_progress_ready, and peer_role_ready from observed state; do not use the metadata-only substrate primitive."}
  - {id: GAP-CONTROLLED-SYNC-RANGE, status: open, required_change: "Bind sync start and end heights, hashes, timestamps, and peer policy to the retained workload output."}
deferred_scope: {presentation_walkthrough: true, mixed_node_comparison: true, weekly_automation: true, stable_release_thresholds: true}
