schema_version: v1
id: node-measurements-v1
title: Per-node measurement exercise contracts
description: Every catalog tap is mapped, including stock header verdicts explicitly absent from default profiles.
  Fallback selection is conditional, never proof of exercise. Known runtime gaps and pinned fallback scenarios block
  completeness without failing security assertions. Target modes, capabilities and resolved artifact compatibility
  must be proven by a later planner.
suite_kind: measurement
result_policy: security-independent-of-measurement-completeness
completion_policy:
  all_catalog_taps_mapped: true
  runtime_implementation_required: true
  non_vacuous_evidence_required: true
  normal_control_required: true
  available_is_exercised: false
  zero_samples_is_exercised: false
exercises:
- measurement_id: amaru-coverage-production-paths
  implementation: amaru
  scenario_id: amaru-cbor-tx-body-fuzz-structured
  version_policy: operator-selected
  rule:
    min_samples: 1
    coverage_envelope:
      min_covered_functions: 1
      required_paths:
      - transaction-body/decode
    correlation:
    - run_id
    - input_id
  normal_control: Require successful normal input and live-node control at the same boundary, bound to the selected
    node and frozen artifact identity.
  evidence_rule: Retain raw samples/events with exact node ID, implementation, source/executable, scenario digest
    and correlation. Evaluate every rule conjunctively. Available, unknown, unavailable and zero-sample results
    are not exercised. Missing rejected/accepted outcomes remain incomplete.
  runtime:
    status: missing
    reason: No runtime collector factory is registered for this catalog tap. Implementation and target-mode/provenance
      binding are required before measurement-complete; this task does not implement collectors.
  fallback:
    scenario_id: amaru-cbor-tx-body-fuzz-structured
    activation_condition: When the selected base campaign produces no evidence satisfying this tap rule; rerun only
      after the declared boundary, normal control and collector prerequisites are available.
    status: ready
- measurement_id: amaru-external-restart-readiness
  implementation: amaru
  scenario_id: amaru-measurement-e2e-stock-portable
  version_policy: operator-selected
  rule:
    restart: true
    required_event: restart_started
    progress:
      min_blocks: 1
  normal_control: Require successful normal input and live-node control at the same boundary, bound to the selected
    node and frozen artifact identity.
  evidence_rule: Retain raw samples/events with exact node ID, implementation, source/executable, scenario digest
    and correlation. Evaluate every rule conjunctively. Available, unknown, unavailable and zero-sample results
    are not exercised. Missing rejected/accepted outcomes remain incomplete.
  runtime:
    status: implemented
  fallback:
    scenario_id: client-example-restart-recovery-sync-amaru
    activation_condition: When base calibration has no intentional restart with listener, peer and chain-progress
      readiness gates.
    status: blocked
    reason: Calibration observes unchanged restart counts; the existing decisive restart-readiness scenario pins
      node versions and needs migration.
