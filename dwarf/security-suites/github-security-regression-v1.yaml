    security_objective: Contain mux ingress overruns to the offending bearer.
    target_nodes:
    - node1
    - node2
    reference_control: Healthy peer traffic and tip probes succeed before and after the malformed ingress.
    workload_fault: Drive receive-side ingress overrun in a shared mixed topology.
    oracle: Require bearer-scoped failure and independent process health and post-fault progress.
    evidence_rule: Retain frozen source and executable identities, input/fault hashes, reached-boundary diagnostics,
      assertion results and successful normal-control evidence. Missing reachability or a masked rejection is inconclusive;
      endpoint loss alone does not prove a crash.
