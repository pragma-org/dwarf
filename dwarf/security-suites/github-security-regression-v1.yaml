schema_version: v1
id: github-security-regression-v1
title: GitHub security regression campaign contracts
description: Version-neutral catalog recipes. Coverage intent is not accepted security coverage; unresolved normal
  controls, oracles, historical pins and prerequisites remain explicit. Mixed security entries use one heterogeneous
  runtime and the source recipe's shared workload and assertions. Measurement calibration or mirrored tap runs
  cannot substitute for that security result. No scenario count establishes completion.
suite_kind: security
result_policy: security-independent-of-measurement-completeness
groups:
- id: malformed-containment
  title: Malformed input and containment
  coverage_intent:
  - structured CBOR rejection
  - decoder containment
  entries:
  - id: amaru-cbor-tx-body-fuzz-structured
    scenario_id: amaru-cbor-tx-body-fuzz-structured
    version_policy: operator-selected
    security_objective: Reject malformed transaction bodies without escaping the decoder boundary.
    target_nodes:
    - node1
    reference_control: A canonical valid transaction-body seed decodes successfully under the same harness identity.
    workload_fault: Structured CBOR corpus mutations with valid transaction-body seeds.
    oracle: Require completed nonempty corpus processing and retained decoder outcomes; a harness-only pass does
      not establish process containment.
    evidence_rule: Retain frozen source and executable identities, input/fault hashes, reached-boundary diagnostics,
      assertion results and successful normal-control evidence. Missing reachability or a masked rejection is inconclusive;
      endpoint loss alone does not prove a crash.
    normal_control:
      scenario_id: amaru-cbor-tx-body-fuzz-structured
      success_rule: A canonical valid transaction-body seed decodes successfully under the same harness identity.
    topology:
      mode: library
      nodes:
      - node_id: node1
        implementation: amaru
    measurement_attachments: []
    limitations:
    - Library decoder evidence only; no real-node crash or network-containment claim.
  - id: cardano-node-cbor-tx-body-fuzz-structured
    scenario_id: cardano-node-cbor-tx-body-fuzz-structured
    version_policy: operator-selected
    security_objective: Reject malformed transaction bodies without escaping the decoder boundary.
    target_nodes:
    - node1
    reference_control: A canonical valid transaction-body seed decodes successfully under the same harness identity.
    workload_fault: Structured CBOR corpus mutations with valid transaction-body seeds.
    oracle: Require completed nonempty corpus processing and retained decoder outcomes; a harness-only pass does
      not establish process containment.
    evidence_rule: Retain frozen source and executable identities, input/fault hashes, reached-boundary diagnostics,
      assertion results and successful normal-control evidence. Missing reachability or a masked rejection is inconclusive;
      endpoint loss alone does not prove a crash.
    normal_control:
      scenario_id: cardano-node-cbor-tx-body-fuzz-structured
      success_rule: A canonical valid transaction-body seed decodes successfully under the same harness identity.
    topology:
      mode: library
      nodes:
      - node_id: node1
        implementation: cardano-node
    measurement_attachments: []
    limitations:
    - Library decoder evidence only; no real-node crash or network-containment claim.
  blocked_candidates: &id002 []
- id: transaction-conformance
  title: Transaction, ledger, serialization and Plutus
  coverage_intent:
  - CBOR serialization differential
  - transaction admission
  - Plutus VM differential
  entries:
  - id: cardano-amaru-cbor-dataset-plutus-data-differential
    scenario_id: cardano-amaru-cbor-dataset-plutus-data-differential
    version_policy: operator-selected
    security_objective: Compare production Plutus-data decoding against the independent dataset reference.
    target_nodes:
    - node1
    reference_control: Positive dataset controls decode and negative controls reject on both implementations.
    workload_fault: Process positive and negative Conway dataset categories.
    oracle: Require all declared categories to be processed with no unexplained candidate/reference mismatch.
    evidence_rule: Retain frozen source and executable identities, input/fault hashes, reached-boundary diagnostics,
      assertion results and successful normal-control evidence. Missing reachability or a masked rejection is inconclusive;
      endpoint loss alone does not prove a crash.
    normal_control:
      scenario_id: cardano-amaru-cbor-dataset-plutus-data-differential
      success_rule: Positive dataset controls decode and negative controls reject on both implementations.
    topology:
      mode: library
      nodes:
      - node_id: node1
        implementation: amaru
    measurement_attachments: []
    limitations:
    - Library conformance evidence; dataset revision is fixture provenance, not a node-version requirement.
  - id: ledger-submit-transaction-array-arity-differential-amaru-cardano-node
    scenario_id: ledger-submit-transaction-array-arity-differential-amaru-cardano-node
    version_policy: operator-selected
    security_objective: Reject truncated transaction envelopes at the decoder boundary.
    target_nodes:
    - node1
    - node2
    reference_control: Independently funded canonical four-element transactions succeed on both nodes.
    workload_fault: Submit identical three-element transaction arrays to both real nodes.
    oracle: Correlate same-attempt decoder rejection and independently observed node responsiveness.
    evidence_rule: Retain frozen source and executable identities, input/fault hashes, reached-boundary diagnostics,
      assertion results and successful normal-control evidence. Missing reachability or a masked rejection is inconclusive;
      endpoint loss alone does not prove a crash.
    normal_control:
      scenario_id: ledger-submit-transaction-array-arity-differential-amaru-cardano-node
      success_rule: Independently funded canonical four-element transactions succeed on both nodes.
    topology:
      mode: shared-runtime
      nodes:
      - node_id: node1
        implementation: amaru
      - node_id: node2
        implementation: cardano-node
    measurement_attachments:
    - node_id: node1
      implementation: amaru
      target_mode: stock
      measurement_profile: amaru-security-default
      result_namespace: nodes/node1/measurements/stock
      additional_measurements:
      - amaru-stock-header-validation
    - node_id: node2
      implementation: cardano-node
      target_mode: stock
      measurement_profile: cardano-security-default
      result_namespace: nodes/node2/measurements/stock
      additional_measurements:
      - cardano-stock-header-validation
    limitations: &id001 []
  - id: ledger-submit-empty-redeemers-container-differential-amaru-cardano-node
    scenario_id: ledger-submit-empty-redeemers-container-differential-amaru-cardano-node
    version_policy: operator-selected
    security_objective: Compare redeemer-container decoding and admission boundaries.
    target_nodes:
    - node1
    - node2
    reference_control: Canonical redeemer containers are accepted with independent funding on each node.
    workload_fault: Submit empty list/map and omitted redeemers against funded normal controls.
    oracle: Require same-attempt typed rejection diagnostics; an opaque RejectTx cannot establish a missing-redeemer
      reason.
    evidence_rule: Retain frozen source and executable identities, input/fault hashes, reached-boundary diagnostics,
      assertion results and successful normal-control evidence. Missing reachability or a masked rejection is inconclusive;
      endpoint loss alone does not prove a crash.
    normal_control:
      scenario_id: ledger-submit-empty-redeemers-container-differential-amaru-cardano-node
      success_rule: Canonical redeemer containers are accepted with independent funding on each node.
    topology:
      mode: shared-runtime
      nodes:
      - node_id: node1
        implementation: amaru
      - node_id: node2
        implementation: cardano-node
    measurement_attachments:
    - node_id: node1
      implementation: amaru
      target_mode: stock
      measurement_profile: amaru-security-default
      result_namespace: nodes/node1/measurements/stock
      additional_measurements:
      - amaru-stock-header-validation
    - node_id: node2
      implementation: cardano-node
      target_mode: stock
      measurement_profile: cardano-security-default
      result_namespace: nodes/node2/measurements/stock
      additional_measurements:
      - cardano-stock-header-validation
    limitations: *id001
  - id: runtime-substrate-plutus-phase2-cek-value-differential-mixed-amaru
    scenario_id: runtime-substrate-plutus-phase2-cek-value-differential-mixed-amaru
    version_policy: operator-selected
    security_objective: Detect divergent Plutus CEK value evaluation.
    target_nodes:
    - node1
    - node2
    reference_control: Normal script-value transactions succeed on both nodes before differential cases.
    workload_fault: Execute the same script-value fixtures on Amaru and cardano-node in one runtime.
    oracle: Compare phase-2 outcomes and retain exact script/input identity at the same boundary.
    evidence_rule: Retain frozen source and executable identities, input/fault hashes, reached-boundary diagnostics,
      assertion results and successful normal-control evidence. Missing reachability or a masked rejection is inconclusive;
      endpoint loss alone does not prove a crash.
    normal_control:
      scenario_id: runtime-substrate-plutus-phase2-cek-value-differential-mixed-amaru
      success_rule: Normal script-value transactions succeed on both nodes before differential cases.
    topology:
      mode: shared-runtime
      nodes:
      - node_id: node1
        implementation: cardano-node
      - node_id: node2
        implementation: amaru
    measurement_attachments:
    - node_id: node1
      implementation: cardano-node
      target_mode: stock
      measurement_profile: cardano-security-default
      result_namespace: nodes/node1/measurements/stock
      additional_measurements:
      - cardano-stock-header-validation
    - node_id: node2
      implementation: amaru
      target_mode: stock
      measurement_profile: amaru-security-default
      result_namespace: nodes/node2/measurements/stock
      additional_measurements:
      - amaru-stock-header-validation
    limitations: *id001
  blocked_candidates: *id002
