- id: consensus-convergence
  title: Consensus partition, fork, rollback and convergence
  coverage_intent:
  - partition and rejoin
  - fork selection (blocked)
  - rollback (blocked)
  - post-fault convergence
  entries:
  - id: phase3-runtime-profile-a-partition-rejoin-primitive
    scenario_id: phase3-runtime-profile-a-partition-rejoin-primitive
    version_policy: operator-selected
    security_objective: Preserve convergence after a bounded network partition.
    target_nodes:
    - node1
    - node2
    - node3
    reference_control: Connected baseline nodes progress before partition and agree after rejoin.
    workload_fault: Partition and rejoin the existing three-node cardano-node profile.
    oracle: Require partition reachability, successful rejoin and independently recorded post-rejoin progress; helper
      exit alone is insufficient.
    evidence_rule: Retain frozen source and executable identities, input/fault hashes, reached-boundary diagnostics,
      assertion results and successful normal-control evidence. Missing reachability or a masked rejection is inconclusive;
      endpoint loss alone does not prove a crash.
    normal_control:
      scenario_id: phase3-runtime-profile-a-partition-rejoin-primitive
      success_rule: Connected baseline nodes progress before partition and agree after rejoin.
    topology:
      mode: shared-runtime
      nodes:
      - node_id: node1
        implementation: cardano-node
      - node_id: node2
        implementation: cardano-node
      - node_id: node3
        implementation: cardano-node
      deployment_profile: profile-a-haskell-peersharing-disabled
    measurement_attachments:
    - node_id: node1
      implementation: cardano-node
      measurement_profile: cardano-security-default
      result_namespace: nodes/node1/measurements/stock
      additional_measurements:
      - cardano-stock-header-validation
    - node_id: node2
      implementation: cardano-node
      measurement_profile: cardano-security-default
      result_namespace: nodes/node2/measurements/stock
      additional_measurements:
      - cardano-stock-header-validation
    - node_id: node3
      implementation: cardano-node
      measurement_profile: cardano-security-default
      result_namespace: nodes/node3/measurements/stock
      additional_measurements:
      - cardano-stock-header-validation
    limitations:
    - Current scenario assertion checks helper completion only; decisive convergence evidence remains a campaign
      prerequisite. Mixed fork/rollback coverage remains blocked.
  blocked_candidates:
  - scenario_id: consensus-chainhold-upstream-differential
    reason: Historical source scenario pins node versions; fork-selection migration is pending.
    activation_condition: Only after this source scenario is migrated to operator-selected node identities and its
      stated fault, normal control and decisive oracle are reviewed.
  - scenario_id: consensus-rollback-recovery-within-k-differential
    reason: Historical source scenario pins node versions; rollback migration is pending.
    activation_condition: Only after this source scenario is migrated to operator-selected node identities and its
      stated fault, normal control and decisive oracle are reviewed.
