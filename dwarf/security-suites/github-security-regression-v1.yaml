    scenario_id: runtime-substrate-txsubmission-unexpected-body-mixed-amaru
    version_policy: operator-selected
    security_objective: Reject unsolicited TxSubmission bodies without poisoning honest peers.
    target_nodes:
    - node1
    - node2
    reference_control: Ordinary TxSubmission request/body exchange succeeds for each observed node.
    workload_fault: Send unexpected bodies in the TxSubmission protocol state machine.
    oracle: Require decisive protocol rejection and continued independent peer responsiveness.
    evidence_rule: Retain frozen source and executable identities, input/fault hashes, reached-boundary diagnostics,
      assertion results and successful normal-control evidence. Missing reachability or a masked rejection is inconclusive;
      endpoint loss alone does not prove a crash.
    normal_control:
      scenario_id: runtime-substrate-txsubmission-unexpected-body-mixed-amaru
      success_rule: Ordinary TxSubmission request/body exchange succeeds for each observed node.
    topology:
      mode: shared-runtime
      nodes:
      - node_id: node1
        implementation: cardano-node
      - node_id: node2
        implementation: amaru
    measurement_attachments:
    - node_id: node1
      implementation: cardano-node
      target_mode: stock
      measurement_profile: cardano-security-default
      result_namespace: nodes/node1/measurements/stock
      additional_measurements:
      - cardano-stock-header-validation
    - node_id: node2
      implementation: amaru
      target_mode: stock
      measurement_profile: amaru-security-default
      result_namespace: nodes/node2/measurements/stock
      additional_measurements:
      - amaru-stock-header-validation
    limitations: *id001
  - id: runtime-substrate-mempool-failure-containment-mixed-amaru
    scenario_id: runtime-substrate-mempool-failure-containment-mixed-amaru
    version_policy: operator-selected
    security_objective: Contain mempool admission failure while preserving liveness.
    target_nodes:
    - node1
    - node2
    reference_control: Funded valid transactions are admitted independently on both nodes.
    workload_fault: Inject invalid transaction admission workload alongside normal mixed-node traffic.
    oracle: Correlate invalid rejection, normal admission, process health and chain progress.
    evidence_rule: Retain frozen source and executable identities, input/fault hashes, reached-boundary diagnostics,
