{
  "spec_version": "v1",
  "id": "plutus-bls12-381-builtins-differential-amaru-cardano-node",
  "title": "Plutus BLS12-381 builtins differential \u2014 pairing, uncompress and non-subgroup subgroup-check agree across Amaru and cardano-node",
  "authors": [
    "dwarf"
  ],
  "tags": [
    "2026-09-27",
    "amaru",
    "bls12-381",
    "cardano-node",
    "coverage",
    "crypto",
    "differential",
    "phase2",
    "plutus",
    "vm"
  ],
  "evidence_intent": "candidate",
  "target": {
    "implementation": "amaru",
    "version": "v10.11.20260925"
  },
  "runtime": "devnet",
  "substrate": {
    "compose_mode": "host",
    "network": "preview",
    "nodes": [
      {
        "id": "node1",
        "impl": "amaru",
        "version": "v10.11.20260925",
        "role": "submitter"
      },
      {
        "id": "node2",
        "impl": "cardano-node",
        "version": "11.1.2",
        "role": "observer"
      }
    ],
    "topology": {
      "edges": [
        {
          "from": "node1",
          "to": "node2"
        },
        {
          "from": "node2",
          "to": "node1"
        }
      ]
    }
  },
  "setup": [
    {
      "primitive": "runtime_install_version",
      "output_dir": "outputs/substrate-install"
    },
    {
      "primitive": "runtime_compose_substrate",
      "output_dir": "outputs/substrate-compose"
    }
  ],
  "load": [
    {
      "primitive": "runtime_plutus_phase2_differential_observation",
      "runtime_metadata_path": "outputs/substrate-compose/runtime.json",
      "target_node": "node1",
      "observer_node": "node2",
      "probe_case": "bls12-381-builtins",
      "output_dir": "outputs/plutus-phase2-differential"
    },
    {
      "primitive": "runtime_multi_node_observation",
      "runtime_metadata_path": "outputs/substrate-compose/runtime.json",
      "node_ids": [
        "node1",
        "node2"
      ],
      "observation_window_seconds": 8,
      "sample_interval_seconds": 1,
      "network_magic": 42,
      "observation_primitives": [
        "tip_state",
        "connection_state"
      ],
      "output_dir": "outputs/multi-node-observation"
    }
  ],
  "probes": [],
  "assertions": [
    {
      "primitive": "all_nodes_responsive"
    },
    {
      "primitive": "plutus_phase2_differential_equivalent"
    }
  ],
  "teardown": [
    {
      "primitive": "runtime_teardown_substrate",
      "output_dir": "outputs/substrate-teardown"
    }
  ]
