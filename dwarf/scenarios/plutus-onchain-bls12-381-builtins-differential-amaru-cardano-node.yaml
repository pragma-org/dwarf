{
 "spec_version": "v1",
 "id": "plutus-onchain-bls12-381-builtins-differential-amaru-cardano-node",
 "title": "Plutus V3 BLS12-381 G1 builtins on chain — operator-selected Amaru and cardano-node",
 "authors": [
  "dwarf"
 ],
 "tags": [
  "amaru",
  "cardano-node",
  "differential",
  "plutus",
  "phase-2",
  "security",
  "bls12-381-builtins"
 ],
 "evidence_intent": "candidate",
 "promotion_blockers": [
  "Admission is the per-case outcome; only the family control is required to be included and adopted.",
  "Expected outcomes come from the Plutus Core specification; a disagreement is a finding candidate until reproduced."
 ],
 "target": {
  "implementation": "amaru",
  "version": "resolved-plan"
 },
 "runtime": "devnet",
 "seed": "0x9C0D1F04",
 "substrate": {
  "compose_mode": "docker",
  "network": "testnet_42",
  "nodes": [
   {
    "id": "node1",
    "impl": "amaru",
    "version": "resolved-plan",
    "identity_binding": "resolved-plan",
    "role": "submitter"
   },
   {
    "id": "node2",
    "impl": "cardano-node",
    "version": "resolved-plan",
    "identity_binding": "resolved-plan",
    "role": "reference"
   }
  ],
  "topology": {
   "edges": [
    {
     "from": "node1",
     "to": "node2"
    }
   ]
  }
 },
 "setup": [
  {
   "primitive": "runtime_install_version",
   "output_dir": "outputs/substrate-install"
  },
  {
   "primitive": "runtime_compose_substrate",
   "output_dir": "outputs/substrate-compose",
   "healthy_timeout_seconds": 360,
   "timeout_seconds": 600
  }
 ],
 "load": [
  {
   "primitive": "runtime_plutus_case_differential",
   "runtime_metadata_path": "outputs/substrate-compose/runtime.json",
   "target_node": "node1",
   "reference_node": "node2",
   "families": [
    "bls12-381-builtins"
   ],
   "output_dir": "outputs/plutus-case-differential"
  },
  {
   "primitive": "runtime_multi_node_observation",
   "runtime_metadata_path": "outputs/substrate-compose/runtime.json",
   "node_ids": [
    "node1",
    "node2"
   ],
   "observation_window_seconds": 8,
   "sample_interval_seconds": 1,
   "network_magic": 42,
   "observation_primitives": [
    "tip_state",
    "connection_state"
   ],
   "output_dir": "outputs/multi-node-observation"
  }
 ],
 "probes": [],
 "assertions": [
  {
   "primitive": "plutus_case_outcomes_agree",
   "result_path": "outputs/plutus-case-differential/result.json"
  },
  {
   "primitive": "all_nodes_responsive"
  }
 ],
 "teardown": [
  {
   "primitive": "runtime_teardown_substrate",
   "output_dir": "outputs/substrate-teardown"
  }
 ]
}
