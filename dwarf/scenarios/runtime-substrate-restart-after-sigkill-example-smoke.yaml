{
  "spec_version": "v1",
  "id": "runtime-substrate-restart-after-sigkill-example-smoke",
  "title": "Compose a two-producer substrate, SIGKILL one producer under TxSubmission load and check that it restarts clean and rejoins",
  "authors": [
    "dwarf"
  ],
  "tags": [
    "substrate",
    "recovery",
    "restart",
    "sigkill",
    "node-lifecycle",
    "finding-cardano-node-gc-segfault-restart"
  ],
  "target": {
    "implementation": "cardano-node",
    "version": "10.7.1"
  },
  "runtime": "devnet",
  "substrate": {
    "network": "testnet_42",
    "nodes": [
      {
        "id": "node1",
        "impl": "cardano-node",
        "version": "10.7.1",
        "role": "honest",
        "identity_binding": "resolved-plan"
      },
      {
        "id": "node2",
        "impl": "cardano-node",
        "version": "10.7.1",
        "role": "honest",
        "identity_binding": "resolved-plan"
      }
    ],
    "topology": {
      "edges": [
        {
          "from": "node1",
          "to": "node2"
        },
        {
          "from": "node2",
          "to": "node1"
        }
      ]
    },
    "compose_mode": "docker"
  },
  "setup": [
    {
      "primitive": "runtime_install_version",
      "output_dir": "outputs/substrate-install"
    },
    {
      "primitive": "runtime_compose_substrate",
      "output_dir": "outputs/substrate-compose"
    }
  ],
  "load": [
    {
      "primitive": "runtime_txsubmission_window_pressure",
      "runtime_metadata_path": "outputs/substrate-compose/runtime.json",
      "target_node": "node1",
      "output_dir": "outputs/txsubmission-window"
    },
    {
      "primitive": "runtime_kill_node",
      "target_node": "node2",
      "signal": "KILL",
      "output_dir": "outputs/kill-node"
    },
    {
      "primitive": "runtime_restart_node",
      "target_node": "node2",
      "output_dir": "outputs/restart-node"
    },
    {
      "primitive": "runtime_multi_node_observation",
      "runtime_metadata_path": "outputs/substrate-compose/runtime.json",
      "node_ids": [
        "node1",
        "node2"
      ],
      "observation_window_seconds": 20,
      "sample_interval_seconds": 1,
      "network_magic": 42,
      "observation_primitives": [
        "tip_state",
        "connection_state"
      ],
      "output_dir": "outputs/multi-node-observation"
    }
  ],
  "probes": [],
  "assertions": [
    {
      "primitive": "all_nodes_started_clean",
      "min_completed": 1,
      "min_node_count": 2
    },
    {
      "primitive": "all_nodes_responsive"
    },
    {
      "primitive": "reconnection_clean",
      "reconnected_node_id": "node2",
      "honest_node_ids": [
        "node1"
      ]
    }
  ],
  "teardown": [
    {
      "primitive": "runtime_teardown_substrate",
      "output_dir": "outputs/substrate-teardown"
    }
  ]
}
