      "primitive": "build_block_segments",
      "recipe": "gov-scriptcontext",
      "reference_node": "node2",
      "target_node": "node1",
      "runtime_metadata_path": "outputs/substrate-compose/runtime.json",
      "output_dir": "outputs/build-segments",
      "label": "gov-votes-setup",
      "note": "built live from the devnet's own genesis funding (no fixture UTxOs): an honest split that also registers the proposal return credential (reg.tx shape) and an honest plain Info proposal (pplain.tx shape) are submitted to the cardano-node producer and confirmed, and the Amaru target must adopt them; prop3 (Info proposal + the ctx_proposal_is_info / ctx_proposal_deposit / ctx_num_proposals MINT observers reading tx.proposal_procedures) and vote (the producer pool's StakePool Yes vote on that proposal + the ctx_votes MINT observer re-parameterised with that pool) are built against the confirmed state as the submit subjects; a second registration + plain proposal pair, never submitted, is the forged block body. A subject that cannot be built is recorded measured:false with its reason."
    },
    {
      "primitive": "forge_block",
      "reference_node": "node2",
      "runtime_metadata_path": "outputs/substrate-compose/runtime.json",
      "output_dir": "outputs/forge-block",
      "note": "forged from the devnet producer's own next empty leader block after arming (its slot, VRF and opcert kept; body = the registration + plain proposal pair; KES re-signed with the pool's own key); descendants re-parented"
    }
  ],
  "load": [
