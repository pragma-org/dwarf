schema_version: v1
id: amaru-external-sync-speed
title: Amaru sync speed
description: Measures adopted blocks per second over a controlled interval using independent chain-tip observations of the real Amaru node.
output_schema: dwarf/spec/v1/measurement-result.schema.json
compatibility:
  implementation: amaru
  versions: [{version: 10.11.20260912, source_revision: b159172f25a9c389f82f20bca4f15e3032791638}]
  target_modes: [stock, coverage, patched]
collection_mode: external
required_capabilities: [dwarf-chain-tip-probe, amaru-chain-tip]
default_enabled: true
overhead_class: negligible
collector: {lifecycle: phase, start: before-workload, stop: after-recovery, failure_behavior: warn}
emitted_artifacts: [measurements/amaru-external-sync-speed/result.json]
correlation_identifiers: [run_id, workload_phase, block_hash, window]
threshold_gate: {supported: true, default_enabled: false}
