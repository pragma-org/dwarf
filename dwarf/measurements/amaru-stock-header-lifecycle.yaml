schema_version: v1
id: amaru-stock-header-lifecycle
title: Amaru header lifecycle
description: Measures real Amaru header Observe, Select, Fetch, and Adopt spans plus sample distributions from stock telemetry.
output_schema: dwarf/spec/v1/measurement-result.schema.json
compatibility:
  implementation: amaru
  versions: [{version: 10.11.20260912, source_revision: b159172f25a9c389f82f20bca4f15e3032791638}]
  target_modes: [stock, patched]
collection_mode: stock-telemetry
required_capabilities: [amaru-header-lifecycle-metrics, amaru-json-traces]
default_enabled: true
overhead_class: low
collector: {lifecycle: run, start: before-workload, stop: after-recovery, failure_behavior: warn}
emitted_artifacts: [measurements/amaru-stock-header-lifecycle/result.json]
correlation_identifiers: [run_id, workload_phase, header_hash, trace_id, span_id]
threshold_gate: {supported: true, default_enabled: false}
