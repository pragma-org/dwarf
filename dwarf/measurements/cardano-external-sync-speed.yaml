schema_version: v1
id: cardano-external-sync-speed
title: Cardano sync speed
description: Measures controlled chain-height progress and recovery using real node tip observations with explicit start/end points and peer policy.
output_schema: dwarf/spec/v1/measurement-result.schema.json
compatibility:
  implementation: cardano-node
  versions: [{version: 11.1.2, source_revision: fef83fed01d7926f3de83b3b917be5a4a48768b5}]
  target_modes: [stock, patched]
collection_mode: external
required_capabilities: [dwarf-chain-tip-probe]
default_enabled: true
overhead_class: negligible
collector: {lifecycle: run, start: before-workload, stop: after-recovery, failure_behavior: warn}
emitted_artifacts: [measurements/cardano-external-sync-speed/result.json]
correlation_identifiers: [run_id, workload_phase, target_node, block_hash]
threshold_gate: {supported: true, default_enabled: false}
