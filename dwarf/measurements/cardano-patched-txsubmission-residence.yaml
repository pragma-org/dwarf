schema_version: v1
id: cardano-patched-txsubmission-residence
title: Cardano TxSubmission2 residence
description: Reserved capability definition for a future continuous per-transaction TxSubmission2 residence patch; it is not enabled by the current patched profile because stock tracing already exposes substantial phase timings and counters.
output_schema: dwarf/spec/v1/measurement-result.schema.json
compatibility:
  implementation: cardano-node
  versions: [{version: 11.1.2, source_revision: fef83fed01d7926f3de83b3b917be5a4a48768b5}]
  target_modes: [patched]
collection_mode: patched-node
required_capabilities: [cardano-patched-txsubmission-residence]
default_enabled: false
overhead_class: moderate
collector: {lifecycle: run, start: before-workload, stop: after-recovery, failure_behavior: warn}
emitted_artifacts: [measurements/cardano-patched-txsubmission-residence/result.json]
correlation_identifiers: [run_id, workload_phase, peer_id, tx_id, request_id]
threshold_gate: {supported: true, default_enabled: false}
