schema_version: v1
id: cardano-patched-txsubmission-residence
title: Cardano TxSubmission2 body-handling residence
description: Exact-source UNBUILT inbound V2 request/body handling residence bounds with native buffered-pending and requested-inflight body depths. Terminal means successful native applyReceivedTxs return or an omitted body; it does not establish mempool submission, acceptance, ledger adoption or security. Stock already exposes cumulative phase waits and mempool-add durations. Requires exact v5 compile/probe, same-boundary control, workload, health and calibration. Campaign joined projection remains blocked pending separate review.
output_schema: dwarf/spec/v1/measurement-result.schema.json
compatibility:
  implementation: cardano-node
  versions: [{version: 11.1.2, source_revision: fef83fed01d7926f3de83b3b917be5a4a48768b5}]
  target_modes: [patched]
collection_mode: patched-node
required_capabilities: [cardano-patched-txsubmission-residence, cardano-patch-identity]
default_enabled: false
overhead_class: moderate
collector: {lifecycle: run, start: before-workload, stop: after-recovery, failure_behavior: warn}
emitted_artifacts: [measurements/cardano-patched-txsubmission-residence/result.json, measurements/cardano-patched-txsubmission-residence/raw/cardano-measurement.ndjson, measurements/cardano-patched-txsubmission-residence/normalized.ndjson, measurements/cardano-patched-txsubmission-residence/txsubmission-correlations.json]
correlation_identifiers: [run_id, workload_phase, trace_session, peer_id, peer_session, request_id, tx_index, tx_id]
threshold_gate: {supported: true, default_enabled: false}
