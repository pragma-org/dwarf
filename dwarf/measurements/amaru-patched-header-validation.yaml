schema_version: v1
id: amaru-patched-header-validation
title: Amaru header validation verdicts (patched)
description: Exact nanoseconds-v4 header-validation contract for returned consensus validate_header results. Accepted and Praos assertion rejection samples retain header hashes and monotonic timing; missing local prerequisites stay unavailable. The patch and collector are implemented but the target build, probe and real normal/adversarial runtime evidence remain unverified.
output_schema: dwarf/spec/v1/measurement-result.schema.json
compatibility:
  implementation: amaru
  versions: [{version: 10.11.20260918, source_revision: aedfe797a5b8ef00d8b362be40b47a52c3b4a379}]
  target_modes: [patched]
collection_mode: patched-node
required_capabilities: [amaru-patched-header-validation-instrumentation, amaru-patch-identity]
default_enabled: false
overhead_class: low
collector: {lifecycle: run, start: before-workload, stop: after-recovery, failure_behavior: warn}
emitted_artifacts: [measurements/amaru-patched-header-validation/result.json]
correlation_identifiers: [run_id, workload_phase, header_hash]
threshold_gate: {supported: true, default_enabled: false}
