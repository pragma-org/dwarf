schema_version: v1
id: amaru-patched-protocol-decode
title: Amaru in-node protocol CBOR decode timing
description: Uses the revision-locked minimally patched Amaru build to measure successful and failed live Handshake ingress at mux-cbor-item, decode and state handling at mini-protocol-decode, and version negotiation at handshake-negotiation where stock traces have no uniform boundary.
output_schema: dwarf/spec/v1/measurement-result.schema.json
compatibility:
  implementation: amaru
  versions: [{version: 10.11.20260912, source_revision: b159172f25a9c389f82f20bca4f15e3032791638}, {version: v10.11.20260912-30-gd3a6dafc, source_revision: d3a6dafcced78f5809a96619e883cf04911d2bdc}, {version: 10.11.20260918, source_revision: aedfe797a5b8ef00d8b362be40b47a52c3b4a379}]
  target_modes: [patched]
collection_mode: patched-node
required_capabilities: [amaru-measurement-patch-protocol-decode, amaru-patch-identity]
default_enabled: false
overhead_class: moderate
collector: {lifecycle: run, start: before-target, stop: after-recovery, failure_behavior: warn}
emitted_artifacts: [measurements/amaru-patched-protocol-decode/result.json]
correlation_identifiers: [run_id, workload_phase, peer_id, connection_id, protocol, message_type, trace_id, span_id]
threshold_gate: {supported: true, default_enabled: false}
