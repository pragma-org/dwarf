schema_version: v1
id: cardano-stock-blockfetch
title: Cardano BlockFetch activity
description: Consumes stock BlockFetch client and server traces and metrics for request, batch, completed-block, delay, size, and served-block observations.
output_schema: dwarf/spec/v1/measurement-result.schema.json
compatibility:
  implementation: cardano-node
  versions: [{version: 11.1.2, source_revision: fef83fed01d7926f3de83b3b917be5a4a48768b5}]
  target_modes: [stock, patched]
collection_mode: stock-telemetry
required_capabilities: [cardano-new-tracing, cardano-blockfetch-traces]
default_enabled: true
overhead_class: low
collector: {lifecycle: run, start: before-workload, stop: after-recovery, failure_behavior: warn}
emitted_artifacts: [measurements/cardano-stock-blockfetch/result.json]
correlation_identifiers: [run_id, workload_phase, peer_id, block_hash]
threshold_gate: {supported: true, default_enabled: false}
