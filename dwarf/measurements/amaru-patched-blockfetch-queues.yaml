schema_version: v1
id: amaru-patched-blockfetch-queues
title: Amaru BlockFetch handler and queue timing
description: Uses the revision-locked minimally patched Amaru build to measure BlockFetch handler, decode, queue depth, and queue residence boundaries absent from stock telemetry.
output_schema: dwarf/spec/v1/measurement-result.schema.json
compatibility:
  implementation: amaru
  versions: [{version: 10.11.20260912, source_revision: b159172f25a9c389f82f20bca4f15e3032791638}]
  target_modes: [patched]
collection_mode: patched-node
required_capabilities: [amaru-measurement-patch-blockfetch, amaru-patch-identity]
default_enabled: false
overhead_class: moderate
collector: {lifecycle: run, start: before-target, stop: after-recovery, failure_behavior: warn}
emitted_artifacts: [measurements/amaru-patched-blockfetch-queues/result.json]
correlation_identifiers: [run_id, workload_phase, peer_id, connection_id, protocol, message_type, block_hash, trace_id]
threshold_gate: {supported: true, default_enabled: false}
