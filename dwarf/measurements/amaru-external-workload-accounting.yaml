schema_version: v1
id: amaru-external-workload-accounting
title: DWARF workload accounting for Amaru
description: Derives offered operations, bytes, batches, successful submissions, rejected submissions, backlog, and phase rates from DWARF workload events.
output_schema: dwarf/spec/v1/measurement-result.schema.json
compatibility:
  implementation: amaru
  versions: [{version: 10.11.20260912, source_revision: b159172f25a9c389f82f20bca4f15e3032791638}, {version: v10.11.20260912-30-gd3a6dafc, source_revision: d3a6dafcced78f5809a96619e883cf04911d2bdc}, {version: 10.11.20260918, source_revision: aedfe797a5b8ef00d8b362be40b47a52c3b4a379}]
  target_modes: [stock, coverage, patched]
collection_mode: external
required_capabilities: [dwarf-workload-events]
default_enabled: true
overhead_class: negligible
collector: {lifecycle: run, start: before-workload, stop: after-recovery, failure_behavior: warn}
emitted_artifacts: [measurements/amaru-external-workload-accounting/result.json]
correlation_identifiers: [run_id, workload_phase, input_id, transaction_id, fault_id, window]
threshold_gate: {supported: true, default_enabled: false}
