schema_version: v1
id: cardano-external-workload-accounting
title: Cardano workload accounting
description: Aggregates offered bytes, batches, attempts, terminal outcomes, backlog, and elapsed time for every retained DWARF workload attempt.
output_schema: dwarf/spec/v1/measurement-result.schema.json
compatibility:
  implementation: cardano-node
  versions: [{version: 11.1.2, source_revision: fef83fed01d7926f3de83b3b917be5a4a48768b5}]
  target_modes: [stock, patched]
collection_mode: external
required_capabilities: [dwarf-workload-events]
default_enabled: true
overhead_class: negligible
collector: {lifecycle: run, start: before-workload, stop: after-recovery, failure_behavior: warn}
emitted_artifacts: [measurements/cardano-external-workload-accounting/result.json]
correlation_identifiers: [run_id, workload_phase, input_id, tx_id]
threshold_gate: {supported: true, default_enabled: false}
