services:
  configurator:
    image: ghcr.io/cardano-foundation/cardano-node-antithesis/configurator@sha256:599a73a401e42b0922751458e92eb5ae432b5e3712153f8843def8ee15d79e4f
    container_name: configurator
    hostname: configurator.example
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    entrypoint:
    - /bin/bash
    - -lc
    command:
    - "set -euo pipefail\n/configurator.sh\nshelley_start=\"$$(jq -r '.systemStart'\
      \ /configs/1/configs/shelley-genesis.json)\"\nbyron_start=\"$$(jq -r '.startTime'\
      \ /configs/1/configs/byron-genesis.json)\"\nfor dir in /configs/*; do\n  shelley=\"\
      $$dir/configs/shelley-genesis.json\"\n  byron=\"$$dir/configs/byron-genesis.json\"\
      \n  jq --arg start \"$$shelley_start\" '.systemStart = $$start' \"$$shelley\"\
      \ > \"$$shelley.tmp\"\n  mv \"$$shelley.tmp\" \"$$shelley\"\n  jq --argjson\
      \ start \"$$byron_start\" '.startTime = $$start' \"$$byron\" > \"$$byron.tmp\"\
      \n  mv \"$$byron.tmp\" \"$$byron\"\ndone\necho \"normalized all pool genesis\
      \ start times to $$shelley_start / $$byron_start\"\n"
    volumes:
    - ./testnet.yaml:/testnet.yaml:ro
    - node1-configs:/configs/1
    - node2-configs:/configs/2
    environment:
      PEER_SHARING: 'false'
    platform: linux/amd64
    init: true
  tracer:
    image: ghcr.io/intersectmbo/cardano-tracer@sha256:da628263a851b419c38d020d3a7dc3b65b20ee84e730faeb74babd6d96f28efe
    container_name: tracer
    hostname: tracer.example
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    entrypoint: cardano-tracer
    command:
    - --config
    - /tracer-config.yaml
    volumes:
    - tracer:/opt/cardano-tracer
    - ./tracer-config.yaml:/tracer-config.yaml:ro
    restart: always
    platform: linux/amd64
    init: true
  log-tailer:
    image: ghcr.io/cardano-foundation/cardano-node-antithesis/log-tailer@sha256:a5d23c42408a1003bb14208fd97dd2bdda102e7002e4e2a2804e71a80df56484
    container_name: log-tailer
    hostname: log-tailer.example
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    volumes:
    - tracer:/tracer:ro
    depends_on:
      tracer:
        condition: service_started
    restart: always
    platform: linux/amd64
    init: true
  node1:
    image: ghcr.io/intersectmbo/cardano-node@sha256:3275d357053d21f3220f74b0854fd584e1fe322dfa1bbb78effd760c3191d14c
    environment:
      CARDANO_BLOCK_PRODUCER: true
    command: "run --topology /configs/configs/topology.json\n  --config /configs/configs/config.json\n\
      \  --database-path /state\n  --socket-path /state/node.socket\n  --tracer-socket-path-connect\
      \ /tracer/tracer.socket\n  --shelley-operational-certificate /configs/keys/opcert.cert\n\
      \  --shelley-kes-key /configs/keys/kes.skey\n  --shelley-vrf-key /configs/keys/vrf.skey\n\
      \  --port 3001\n  --host-addr 0.0.0.0\n  +RTS -N -A16m -qg -qb -RTS\n"
    restart: always
    depends_on:
      configurator:
        condition: service_completed_successfully
      tracer:
        condition: service_started
    container_name: node1
    hostname: node1.example
    volumes:
    - node1-configs:/configs:ro
    - ./topology/node1.json:/configs/configs/topology.json:ro
    - node1-state:/state
    - node1-evidence:/evidence
    - tracer:/tracer
    platform: linux/amd64
    init: true
  node2:
    image: ghcr.io/intersectmbo/cardano-node@sha256:3275d357053d21f3220f74b0854fd584e1fe322dfa1bbb78effd760c3191d14c
    environment:
      CARDANO_BLOCK_PRODUCER: true
    command: "run --topology /configs/configs/topology.json\n  --config /configs/configs/config.json\n\
      \  --database-path /state\n  --socket-path /state/node.socket\n  --tracer-socket-path-connect\
      \ /tracer/tracer.socket\n  --shelley-operational-certificate /configs/keys/opcert.cert\n\
      \  --shelley-kes-key /configs/keys/kes.skey\n  --shelley-vrf-key /configs/keys/vrf.skey\n\
      \  --port 3001\n  --host-addr 0.0.0.0\n  +RTS -N -A16m -qg -qb -RTS\n"
    restart: always
    depends_on:
      configurator:
        condition: service_completed_successfully
      tracer:
        condition: service_started
    container_name: node2
    hostname: node2.example
    volumes:
    - node2-configs:/configs:ro
    - ./topology/node2.json:/configs/configs/topology.json:ro
    - node2-state:/state
    - node2-evidence:/evidence
    - tracer:/tracer
    platform: linux/amd64
    init: true
  dwarf-workload:
    platform: linux/amd64
    container_name: dwarf-workload
    hostname: dwarf-workload.example
    init: true
    user: 0:0
    environment:
      DWARF_ANTITHESIS_PACKAGE_DIR: /opt/dwarf/package
      DWARF_ANTITHESIS_READY_TIMEOUT: '900'
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
      com.dwarf.build-network: none
    volumes:
    - node1-state:/inputs/node1:ro
    - node2-state:/inputs/node2:ro
    - dwarf-workload-evidence:/evidence
    depends_on:
      node1:
        condition: service_started
      node2:
        condition: service_started
      configurator:
        condition: service_completed_successfully
    image: ghcr.io/j-gainsec/dwarf-dwarf-workload@sha256:b4d339cdfc925f2505f2f2341781ddfecaa2cdd644dc3e77e3e66f43d0b7a732
volumes:
  tracer: {}
  node1-configs: {}
  node1-state: {}
  node1-evidence: {}
  node2-configs: {}
  node2-state: {}
  node2-evidence: {}
  dwarf-workload-evidence: {}
