{
  "spec_version": "v1",
  "id": "consensus-chainhold-upstream-differential",
  "title": "Chainhold chain-selection differential \u2014 induced fork + reorg on a mixed testnet_42 devnet, cardano-node vs Amaru",
  "authors": [
    "dwarf"
  ],
  "tags": [
    "consensus",
    "chainhold",
    "differential",
    "chain-selection",
    "partition",
    "rollback",
    "amaru"
  ],
  "target": {
    "implementation": "cardano-node",
    "version": "resolved-plan"
  },
  "runtime": "devnet",
  "seed": "0x0c4a1d01",
  "substrate": {
    "compose_mode": "docker",
    "network": "testnet_42",
    "nodes": [
      {
        "id": "relay1",
        "impl": "cardano-node",
        "version": "resolved-plan",
        "identity_binding": "resolved-plan",
        "role": "honest"
      },
      {
        "id": "relay2",
        "impl": "cardano-node",
        "version": "resolved-plan",
        "identity_binding": "resolved-plan",
        "role": "honest"
      },
      {
        "id": "amaru-consumer",
        "impl": "amaru",
        "version": "resolved-plan",
        "identity_binding": "resolved-plan",
        "role": "observer"
      }
    ],
    "topology": {
      "edges": [
        {
          "from": "relay1",
          "to": "relay2"
        },
        {
          "from": "relay2",
          "to": "relay1"
        },
        {
          "from": "amaru-consumer",
          "to": "relay1"
        },
        {
          "from": "relay1",
          "to": "amaru-consumer"
        },
        {
          "from": "amaru-consumer",
          "to": "relay2"
        },
        {
          "from": "relay2",
          "to": "amaru-consumer"
        }
      ]
    }
  },
  "setup": [
    {
      "primitive": "runtime_install_version",
      "output_dir": "outputs/substrate-install"
    },
    {
      "primitive": "runtime_compose_substrate",
      "output_dir": "outputs/substrate-compose"
    }
  ],
  "load": [
    {
      "primitive": "runtime_multi_node_observation",
      "runtime_metadata_path": "outputs/substrate-compose/runtime.json",
      "node_ids": [
        "relay1",
        "relay2",
        "amaru-consumer"
      ],
      "observation_window_seconds": 18,
      "sample_interval_seconds": 3,
      "network_magic": 42,
      "observation_primitives": [
        "tip_state",
        "connection_state"
      ],
      "timeout_seconds": 180,
      "output_dir": "outputs/obs"
    }
  ],
  "probes": [],
  "assertions": [
    {
      "primitive": "chain_select_differential",
      "reference_node_ids": [
        "relay1",
        "relay2"
      ],
      "target_node_ids": [
        "amaru-consumer"
      ],
      "tolerance_slots": 5,
      "require_real_progress": true
    }
  ],
  "teardown": [
    {
      "primitive": "runtime_teardown_substrate",
      "output_dir": "outputs/substrate-teardown"
    }
  ],
  "evidence_intent": "candidate",
  "iterations": 1,
  "shrink": false,
  "faults": [
    {
      "primitive": "runtime_network_partition",
      "runtime_metadata_path": "outputs/substrate-compose/runtime.json",
      "target_node": "relay2",
      "partition_seconds": 90,
      "settle_seconds": 70,
      "output_dir": "outputs/partition"
    }
  ]
}
