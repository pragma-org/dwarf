name: DWARF library fuzz

# Phase 1 of "run the tests in CI": builds the Amaru decoder harnesses and runs the
# library-tier CBOR / mini-protocol fuzz over every registered decoder target,
# failing the build on any crash (panic / abort / hang). Unlike the validation gate
# (dwarf-validate.yml), this ACTUALLY EXECUTES the decoders — it does not stand up a
# devnet, need a wallet, or touch the paid Antithesis service.

on:
  push:
    branches: [main]
    paths:
      - "dwarf/targets/**"
      - "dwarf/scenarios/amaru-cbor-*-fuzz.yaml"
      - "dwarf/profile_manager/run_service.py"
      - ".github/workflows/dwarf-fuzz.yml"
  pull_request:
    paths:
      - "dwarf/targets/**"
      - "dwarf/scenarios/amaru-cbor-*-fuzz.yaml"
      - "dwarf/profile_manager/run_service.py"
      - ".github/workflows/dwarf-fuzz.yml"
  schedule:
    - cron: "0 5 * * *"        # nightly, deeper budget
  workflow_dispatch:
    inputs:
      iterations:
        description: "Inputs per target"
        default: "500"

# Pinned so the harness path-deps resolve and the build is reproducible.
env:
  AMARU_REPO: pragma-org/amaru
  AMARU_REF: 493bffba0cc4db2291643cdd6698197c374958b3   # v10.11.20260807
  PALLAS_REPO: txpipe/pallas
  PALLAS_REF: 3951639df88bfe18a41cb179bef3021f8ab27c82

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout DWARF
        uses: actions/checkout@v4

      # The harness Cargo.toml uses path-deps at <repo>/codebases/{amaru,pallas}.
      - name: Checkout Amaru (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AMARU_REPO }}
          ref: ${{ env.AMARU_REF }}
          path: codebases/amaru

      - name: Checkout Pallas (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PALLAS_REPO }}
          ref: ${{ env.PALLAS_REF }}
          path: codebases/pallas

      # rust-toolchain.toml in dwarf/targets/amaru pins the required nightly;
      # rustup installs it automatically on first cargo invocation there.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dwarf/targets/amaru/target
          key: dwarf-fuzz-cargo-${{ env.AMARU_REF }}-${{ hashFiles('dwarf/targets/amaru/Cargo.lock') }}

      - name: Build decoder harnesses
        working-directory: dwarf/targets/amaru
        run: cargo build --release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DWARF runtime dependencies
        run: python3 -m pip install -r dwarf/scripts/requirements-ci.txt

      - name: Run registered library fuzz scenarios through Run Service
        run: |
          ITERS="${{ github.event.inputs.iterations || (github.event_name == 'schedule' && '20000' || '500') }}"
          mkdir -p ci-fuzz-runs ci-fuzz-state
          python3 - <<'PY' > /tmp/dwarf-fuzz-scenarios
          import json
          from pathlib import Path
          for path in sorted(Path("dwarf/scenarios").glob("amaru-cbor-*-fuzz.yaml")):
              data = json.loads(path.read_text(encoding="utf-8"))
              if any(item.get("primitive") == "cbor_fuzz_target" for item in data.get("load", [])):
                  print(path)
          PY
          test -s /tmp/dwarf-fuzz-scenarios
          while IFS= read -r scenario; do
            python3 dwarf/cardano-profile scenario run "$scenario" \
              --origin ci \
              --fuzz-iterations "$ITERS" \
              --runs-dir ci-fuzz-runs \
              --state-dir ci-fuzz-state
          done < /tmp/dwarf-fuzz-scenarios

      - name: Upload canonical fuzz run bundles and ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dwarf-fuzz-runs
          path: |
            ci-fuzz-runs/
            ci-fuzz-state/
          if-no-files-found: ignore
